<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="storefront">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Menova</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Phone performance (docs/PERF_ON_PHONE.md), before Flutter loads:
    - menovaPhone tells flutter_bootstrap.js to use the multi-surface
      rasterizer on phones.
    - Phones render at most 2 physical pixels per CSS pixel. On 3x screens
      this draws 2.25x fewer pixels per frame (the engine reads
      window.devicePixelRatio); text stays sharp at 2x.
  -->
  <script>
    (function () {
      var ua = navigator.userAgent;
      var phone = (navigator.userAgentData && navigator.userAgentData.mobile) ||
        /Android|iPhone|iPad|iPod|Mobi/i.test(ua);
      window.menovaPhone = !!phone;
      if (!phone) return;
      try {
        var desc = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') ||
          Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
        Object.defineProperty(window, 'devicePixelRatio', {
          configurable: true,
          get: function () { return Math.min(desc.get.call(window), 2); },
        });
      } catch (e) {
        // Keep the real ratio if the browser does not allow overriding it.
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
