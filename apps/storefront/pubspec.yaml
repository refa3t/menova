name: storefront
description: "Customer storefront (Flutter Web)."
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.9.0
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  shared_preferences: ^2.3.0
  crypto: ^3.0.6
  http: ^1.2.0
  web: ^1.1.0
  firebase_auth: ^6.0.0
  go_router: ^16.0.0
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  core:
    path: ../../packages/core
  product_builder:
    path: ../../packages/product_builder
  pricing:
    path: ../../packages/pricing
  animation:
    path: ../../packages/animation
  category_definitions:
    path: ../../packages/category_definitions
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
